[package]
name = "rustdraft-engine"
description = "RustDraft engine: sessions, commands, the command line and prompts, snaps, selection, undo"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
rustdraft-geom = { workspace = true }
rustdraft-color = { workspace = true }
rustdraft-doc = { workspace = true }
rustdraft-dxf = { workspace = true }
rustdraft-constraints = { workspace = true }
rustdraft-fonts = { workspace = true }
rustdraft-render = { workspace = true }
craft-docpath = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# R-tree spatial index for picking, window selection and object snaps (MIT OR Apache-2.0).
rstar = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Real DXF files for the external reference tests (io is a lower layer).
rustdraft-io = { workspace = true }
