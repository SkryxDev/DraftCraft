[package]
name = "draftcraft-engine"
description = "DraftCraft engine: sessions, commands, the command line and prompts, snaps, selection, undo"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
draftcraft-geom = { workspace = true }
draftcraft-color = { workspace = true }
draftcraft-doc = { workspace = true }
draftcraft-dxf = { workspace = true }
draftcraft-constraints = { workspace = true }
draftcraft-fonts = { workspace = true }
draftcraft-render = { workspace = true }
craft-docpath = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# R-tree spatial index for picking, window selection and object snaps (MIT OR Apache-2.0).
rstar = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Real DXF files for the external reference tests (io is a lower layer).
draftcraft-io = { workspace = true }
