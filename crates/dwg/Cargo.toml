[package]
name = "draftcraft-dwg"
description = "DraftCraft's DWG codec: reads R13–2018 DWG into object records and writes 2018 DWG (from BlackCAD), with the acadrust crate (MPL-2.0, used unmodified) as a fallback"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
log = { workspace = true }
chrono = { workspace = true }

# The same target as build.rs's `no_acadrust` leaves acadrust out: FreeBSD aarch64, where
# acadrust 0.6.6 passed a `*const c_char` (u8 there) to its own `*const i8` sysctlbyname.
# wasm32 builds it: acadrust uses `web-time` for its clocks and runs its parallel stages
# sequentially there, and it memory-maps files only on native targets.
# A commit of acadrust's main branch, not a release: 0.6.8 and older write 2004–2018 DWG files that
# AutoCAD refuses (their section map has no empty first entry; acadrust issue #281, fixed by PR #280).
# Go back to a crates.io version (also in crates/io/Cargo.toml) once one includes that fix.
[target.'cfg(not(all(target_os = "freebsd", target_arch = "aarch64")))'.dependencies]
# MPL-2.0: used as an unmodified dependency only (see plan/adr/0001 and NOTICE).
acadrust = { git = "https://github.com/hakanaktt/acadrust", rev = "008c6391bbb5deb7baf4bd44495b7b1cfc53eceb" }
