<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DraftCraft</title>
  <link data-trunk rel="rust" data-bin="draftcraft-web" data-wasm-opt="z" data-weak-refs />
  <link data-trunk rel="icon" href="../../assets/app-icon/draftcraft-64.png" type="image/png" />
  <link data-trunk rel="copy-file" href="../../assets/app-icon/draftcraft-256.png" />

    #draftcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;

  </style>

<body>
  <canvas id="draftcraft_canvas"></canvas>
  <div id="draftcraft_loading"><img src="draftcraft-256.png" width="96" height="96" alt="" style="margin-bottom:16px">Loading DraftCraft&hellip;</div>
