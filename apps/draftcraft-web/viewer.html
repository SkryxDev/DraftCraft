<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Phones: the page never zooms itself; the viewer's own pinch zooms the drawing. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#181d23">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>DraftCraft</title>
  <link data-trunk rel="rust" data-bin="draftcraft-viewer" data-wasm-opt="z" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #212830;
      overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #draftcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #draftcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b8b8b8; font: 15px system-ui, sans-serif; pointer-events: none; text-align: center; padding: 16px; }
  </style>
</head>
<body>
  <canvas id="draftcraft_canvas"></canvas>
  <div id="draftcraft_loading">Loading DraftCraft&hellip;</div>
</body>
</html>
