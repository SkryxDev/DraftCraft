[package]
name = "draftcraft-cli"
description = "DraftCraft command-line tool: info, convert, run scripts, export, commands, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "draftcraft_cli"
path = "src/lib.rs"

[[bin]]
name = "draftcraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
draftcraft-engine = { workspace = true }
draftcraft-io = { workspace = true }
draftcraft-mcp = { workspace = true }
draftcraft-render = { workspace = true }
clap = { workspace = true }
same-file = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Shell completions and man pages (examples/man-and-completions.rs, for the Linux packages); not
# in the binary.
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
